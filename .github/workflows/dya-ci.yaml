# .github/workflows/dya-ci.yaml
# CI workflow for DYALEMCHIRZ components

name: DYALEMCHIRZ CI

on:
  push:
    branches: [ master, main, phase-* ]
    paths:
      - 'dya/**'
      - '.github/workflows/dya-ci.yaml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'dya/**'
      - '.github/workflows/dya-ci.yaml'

env:
  GO_VERSION: '1.26.0'
  MODULE_PATH: './dya'

jobs:
  # Job 1: Lint & Format
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.64.8

      - name: Run golangci-lint
        run: |
          cd ${{ env.MODULE_PATH }}
          golangci-lint run ./...

      - name: Check formatting
        run: |
          cd ${{ env.MODULE_PATH }}
          test -z $(gofmt -l .) || (echo "Files not formatted:" && gofmt -l . && exit 1)

  # Job 2: Build
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build dya-controller
        run: |
          cd ${{ env.MODULE_PATH }}
          go build -v -o bin/dya-controller ./cmd/dya-controller

      - name: Build dya-cli
        run: |
          cd ${{ env.MODULE_PATH }}
          go build -v -o bin/dya-cli ./cmd/dya-cli

      - name: Verify binaries exist
        run: |
          cd ${{ env.MODULE_PATH }}
          test -f bin/dya-controller || (echo "dya-controller not built" && exit 1)
          test -f bin/dya-cli || (echo "dya-cli not built" && exit 1)
          echo "✅ Binaries built successfully"
          ls -la bin/

  # Job 3: Unit Test
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run unit tests
        run: |
          cd ${{ env.MODULE_PATH }}
          go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ env.MODULE_PATH }}/coverage.out

      - name: Display coverage summary
        run: |
          cd ${{ env.MODULE_PATH }}
          go tool cover -func=coverage.out | tail -1

  # Job 4: Security Scan (Dependency)
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd ${{ env.MODULE_PATH }}
          govulncheck ./... || true  # Warn but don't fail initially

      - name: Check dependencies for known vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '${{ env.MODULE_PATH }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'Dependency Scan'

  # Job 5: Notify on completion (opsional)
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [lint, build, test, security]
    if: always()
    steps:
      - name: Check overall status
        run: |
          echo "✅ All CI jobs completed"
          echo "Status: ${{ job.status }}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
