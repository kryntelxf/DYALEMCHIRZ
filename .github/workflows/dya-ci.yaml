# .github/workflows/dya-ci.yaml
# CI workflow for DYALEMCHIRZ components

name: DYALEMCHIRZ CI

on:
  push:
    branches: [ master, main, phase-* ]
    paths:
      - 'dya/**'
      - '.github/workflows/dya-ci.yaml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'dya/**'
      - '.github/workflows/dya-ci.yaml'

env:
  GO_VERSION: '1.26.0'

jobs:
  # Job 0: Check if dya directory exists
  check-dya:
    name: Check DYALEMCHIRZ directory
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if dya directory exists
        id: check
        run: |
          if [ -d "dya" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ dya directory found"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "ℹ️ dya directory not found - skipping DYALEMCHIRZ CI"
          fi

  # Job 1: Lint & Format
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: check-dya
    if: needs.check-dya.outputs.exists == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.64.8

      - name: Run golangci-lint
        run: |
          cd dya
          golangci-lint run ./... || true  # Warn but don't fail initially

      - name: Check formatting
        run: |
          cd dya
          test -z $(gofmt -l .) || (echo "⚠️ Files not formatted:" && gofmt -l . && exit 0)

  # Job 2: Build
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [check-dya, lint]
    if: needs.check-dya.outputs.exists == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('dya/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build dya-controller
        run: |
          cd dya
          go build -v -o bin/dya-controller ./cmd/dya-controller

      - name: Build dya-cli
        run: |
          cd dya
          go build -v -o bin/dya-cli ./cmd/dya-cli

      - name: Verify binaries exist
        run: |
          cd dya
          test -f bin/dya-controller || (echo "❌ dya-controller not built" && exit 1)
          test -f bin/dya-cli || (echo "❌ dya-cli not built" && exit 1)
          echo "✅ Binaries built successfully:"
          ls -la bin/

  # Job 3: Unit Test
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    needs: [check-dya, build]
    if: needs.check-dya.outputs.exists == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('dya/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run unit tests
        run: |
          cd dya
          go test -v -race -coverprofile=coverage.out ./...

      - name: Display coverage summary
        run: |
          cd dya
          if [ -f coverage.out ]; then
            go tool cover -func=coverage.out | tail -1
          else
            echo "ℹ️ No coverage file generated"
          fi

  # Job 4: Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [check-dya, build]
    if: needs.check-dya.outputs.exists == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd dya
          govulncheck ./... || true  # Warn but don't fail initially

      - name: Check dependencies for known vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'dya/'
          format: 'table'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
        continue-on-error: true  # Don't fail CI for security issues initially
