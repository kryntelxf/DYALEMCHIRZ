# DYALEMCHIRZ CI workflow
name: DYALEMCHIRZ CI

on:
  push:
    branches: [ master, main, phase-* ]
    paths:
      - 'dya/**'
      - '.github/workflows/dya-ci.yaml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'dya/**'
      - '.github/workflows/dya-ci.yaml'

env:
  GO_VERSION: '1.26.0'

jobs:
  check-dya:
    name: Check DYALEMCHIRZ directory
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -d "dya" ] && [ -f "dya/cmd/dya-controller/main.go" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ dya directory found"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "ℹ️ dya directory not fully populated - skipping build"
          fi

  build:
    name: Build DYALEMCHIRZ
    runs-on: ubuntu-latest
    needs: check-dya
    if: needs.check-dya.outputs.exists == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Build dya-controller
        run: |
          go build -v -o dya/bin/dya-controller ./dya/cmd/dya-controller
      
      - name: Build dya-cli
        run: |
          go build -v -o dya/bin/dya-cli ./dya/cmd/dya-cli
      
      - name: Verify binaries
        run: |
          if [ -f "dya/bin/dya-controller" ] && [ -f "dya/bin/dya-cli" ]; then
            echo "✅ Build successful!"
            ls -la dya/bin/
          else
            echo "❌ Build failed - binaries not found"
            exit 1
          fi

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: [check-dya, build]
    if: needs.check-dya.outputs.exists == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Run tests
        run: |
          go test -v ./dya/... 2>/dev/null || echo "ℹ️ No tests found yet - this is expected for Phase 1"
      
      - name: Check test coverage
        run: |
          go test -cover ./dya/... 2>/dev/null || echo "ℹ️ Coverage not available yet"
