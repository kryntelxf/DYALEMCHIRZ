# DYALEMCHIRZ CI workflow
name: DYALEMCHIRZ CI

on:
  push:
    branches: [ master, main, phase-* ]
  pull_request:
    branches: [ master, main ]

env:
  GO_VERSION: '1.26.0'

jobs:
  check-dya:
    name: Check DYALEMCHIRZ directory
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -d "dya" ] && [ -f "dya/cmd/dya-controller/main.go" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ dya directory found"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "ℹ️ dya directory not found"
          fi

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: check-dya
    if: needs.check-dya.outputs.exists == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run gofmt
        run: |
          cd dya
          gofmt -l . || echo "Formatting issues found"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: check-dya
    if: needs.check-dya.outputs.exists == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build dya-controller
        run: |
          go build -v -o dya/bin/dya-controller ./dya/cmd/dya-controller
      - name: Build dya-cli
        run: |
          go build -v -o dya/bin/dya-cli ./dya/cmd/dya-cli
      - name: Verify binaries
        run: |
          if [ -f "dya/bin/dya-controller" ] && [ -f "dya/bin/dya-cli" ]; then
            echo "✅ Build successful!"
            ls -la dya/bin/
          else
            echo "❌ Build failed"
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [check-dya, build]
    if: needs.check-dya.outputs.exists == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run tests
        run: |
          cd dya
          go test -v ./... 2>/dev/null || echo "ℹ️ No tests found"

  verify-api:
    name: Verify API
    runs-on: ubuntu-latest
    needs: check-dya
    if: needs.check-dya.outputs.exists == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Check API files
        run: |
          if [ -d "dya/api" ]; then
            echo "✅ API directory found"
            go build -v ./dya/api/... 2>/dev/null || echo "ℹ️ API build skipped"
          else
            echo "ℹ️ No API directory"
          fi
