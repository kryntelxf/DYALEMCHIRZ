name: DYALEMCHIRZ CI

on:
  push:
    branches: [ "phase-1-foundation-from-master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Build from dya folder
      shell: bash
      run: |
        cd dya
        go version
        go build -v -o dya-controller ./cmd/dya-controller
        pwd
        ls -la

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dya-controller
        path: dya/dya-controller
        if-no-files-found: error
