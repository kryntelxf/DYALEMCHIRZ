name: DYALEMCHIRZ CI

on:
  push:
    branches: [ "phase-1-foundation-from-master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Build
      run: |
        cd dya
        go mod init k8s.io/kubernetes/dya
        go mod tidy
        go build -v -o dya-controller ./cmd/dya-controller

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: dya-controller
        path: dya/dya-controller
