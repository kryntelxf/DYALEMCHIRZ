name: Build

on:
  push:
    branches: [ "phase-1-foundation-from-master" ]
  pull_request:
    branches: [ "phase-1-foundation-from-master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Build
      working-directory: ./dya
      run: |
        go mod init k8s.io/kubernetes/dya 2>/dev/null || true
        go get k8s.io/klog/v2
        go mod tidy
        go build -v -o dya-controller ./cmd/dya-controller
        ls -la

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: dya-controller
        path: dya/dya-controller
