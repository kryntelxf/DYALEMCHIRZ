apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dyalemchirz.fullname" . }}-config
  labels:
    {{- include "dyalemchirz.labels" . | nindent 4 }}
data:
  tenant-config.yaml: |
    tenants:
    {{- range .Values.tenants }}
      - id: {{ .id }}
        name: {{ .name }}
        description: {{ .description }}
        quota:
          maxNodes: {{ .quota.maxNodes }}
          maxAssets: {{ .quota.maxAssets }}
          maxEvents: {{ .quota.maxEvents }}
          maxAIProcesses: {{ .quota.maxAIProcesses }}
    {{- end }}
  
  api-keys.yaml: |
    apiKeys:
    {{- range $key, $value := .Values.apiKeys }}
      {{ $key }}: {{ $value }}
    {{- end }}
